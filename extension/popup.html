<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Fasca Focus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      min-height: 480px;
      background: #0a0a1a;
      font-family: 'Outfit', sans-serif;
      color: #e2e8f0;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(124,58,237,0.2);
    }
    .logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px;
    }
    .logo-text { font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #a78bfa; }

    /* Status badge */
    .status-badge {
      margin-bottom: 20px;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }
    .status-badge.idle    { background: rgba(100,116,139,0.15); border: 1px solid rgba(100,116,139,0.3); color: #64748b; }
    .status-badge.focus   { background: rgba(124,58,237,0.15);  border: 1px solid rgba(124,58,237,0.4);  color: #a78bfa; }
    .status-badge.break   { background: rgba(5,150,105,0.15);   border: 1px solid rgba(5,150,105,0.4);   color: #34d399; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.idle  { background: #64748b; }
    .dot.focus { background: #a78bfa; animation: blink 1.5s infinite; }
    .dot.break { background: #34d399; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Login section */
    #loginSection { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 10px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: rgba(124,58,237,0.7); }
    input::placeholder { color: #475569; }

    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-outline { background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3); color: #a78bfa; }
    .btn-outline:hover { background: rgba(124,58,237,0.2); }
    .btn-danger { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    /* Section headings */
    .section-title {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: #475569; margin-bottom: 10px;
    }

    /* Blocklist */
    .blocklist-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .blocklist-input-row input { flex: 1; }

    .blocklist-items { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; }
    .blocklist-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      font-size: 13px;
    }
    .blocklist-item .domain { color: #94a3b8; font-family: monospace; }
    .blocklist-item .remove {
      color: #f87171; cursor: pointer; font-size: 16px;
      line-height: 1; background: none; border: none; padding: 0;
    }
    .blocklist-item .remove:hover { color: #fca5a5; }

    .empty { color: #334155; font-size: 12px; text-align: center; padding: 20px 0; }

    .divider { height: 1px; background: rgba(124,58,237,0.15); margin: 16px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-mark">F</div>
    <div class="logo-text">Fasca</div>
  </div>

  <!-- Status -->
  <div class="status-badge idle" id="statusBadge">
    <div class="dot idle" id="statusDot"></div>
    <span id="statusText">Idle – No active session</span>
  </div>

  <!-- Login (shown when not authenticated) -->
  <div id="loginSection">
    <div class="section-title">Connect Account</div>
    <input type="email" id="emailInput" placeholder="your@email.com"/>
    <input type="password" id="passwordInput" placeholder="Password"/>
    <button class="btn-primary" id="loginBtn">Connect to Fasca</button>
    <div id="loginError" style="color:#f87171;font-size:12px;display:none;"></div>
  </div>

  <!-- Main controls (shown when authenticated) -->
  <div id="mainSection" style="display:none;">
    <div class="section-title">Blocked Sites</div>
    <div class="blocklist-input-row">
      <input type="text" id="newDomain" placeholder="youtube.com"/>
      <button class="btn-outline" id="addDomainBtn">Add</button>
    </div>
    <div class="blocklist-items" id="blocklistItems">
      <div class="empty">No blocked sites yet</div>
    </div>
    <div class="divider"></div>
    <button class="btn-danger" id="logoutBtn" style="width:100%;">Disconnect Account</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
