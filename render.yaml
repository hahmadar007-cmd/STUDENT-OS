services:
  - type: web
    name: student-os-backend
    env: docker
    dockerfilePath: Dockerfile
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard — never commit credentials
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        sync: false
