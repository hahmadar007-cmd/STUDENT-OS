<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudentOS – YouTube Connect</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin:0; }
    button { padding: 0.8rem 1.6rem; font-size: 1rem; border: none; border-radius: 0.5rem; background: linear-gradient(45deg, #ff5f6d, #ffc371); color:#fff; cursor:pointer; transition: transform 0.2s; }
    button:hover { transform: scale(1.05); }
    #status { margin-top:1rem; font-size:0.9rem; }
  </style>
</head>
<body>
  <button id="connectBtn">Connect YouTube</button>
  <div id="status"></div>
  <script src="main.js"></script>
